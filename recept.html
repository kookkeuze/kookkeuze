<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recept – Kookkeuze</title>
  <!-- Eigen recepten zijn privé: alleen zichtbaar voor wie toegang heeft tot de
       database waar ze in staan. Daarom niet indexeren en niet volgen. -->
  <meta name="robots" content="noindex, nofollow" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
  />
  <link rel="stylesheet" href="/styles.css" />

  <!-- Umami: privacyvriendelijke statistieken, cookieloos en zonder
       toestemmingsbanner. Defer, dus het blokkeert het laden niet. -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="b57021f2-91b0-4ba7-bd2c-19278aefe4d5"></script>
</head>
<body>
  <!-- Op deze pagina staat links een terugknop en het logo in het midden, zoals
       een detailscherm in een app. Alleen het logo liet op mobiel niet zien
       hoe je terugkwam. -->
  <header class="topbar topbar--recipe">
    <div class="topbar-inner">
      <a href="/" id="ownRecipeBackBtn" class="own-recipe-back">
        <i class="fas fa-chevron-left" aria-hidden="true"></i>
        <span>Terug</span>
      </a>

      <a href="/" class="own-recipe-logo" aria-label="Ga naar home">
        <img src="/Logo/Kookkeuze-logo.svg" alt="Kookkeuze-logo" class="logo-img" />
      </a>
    </div>
  </header>

  <main class="container">
    <article id="ownRecipePage" class="tab-content active own-recipe-page">
      <p id="ownRecipeStatus" class="own-recipe-status">Recept laden…</p>
      <div id="ownRecipeBody" hidden></div>
    </article>
  </main>

  <!-- Kiezen welke ingredienten daadwerkelijk op de lijst komen. Zelfde
       venster als op de hoofdpagina. -->
  <div id="ingredientPickModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content ingredient-pick-modal-content">
      <button id="closeIngredientPickModal" class="modal-close" aria-label="Sluiten">
        <i class="fas fa-times"></i>
      </button>
      <div class="shopping-head">
        <h3 class="shopping-title">Ingrediënten</h3>
        <p id="ingredientPickSub" class="shopping-subtitle"></p>
      </div>
      <div class="shopping-toolbar">
        <span id="ingredientPickCount" class="shopping-count"></span>
        <button id="ingredientPickToggleAllBtn" type="button" class="shopping-text-btn">Alles uit</button>
      </div>
      <div id="ingredientPickBody" class="shopping-scroll"></div>
      <div class="shopping-actions">
        <button id="ingredientPickCancelBtn" type="button" class="shopping-text-btn">Annuleer</button>
        <button id="ingredientPickConfirmBtn" type="button" class="shopping-primary-btn">Toevoegen</button>
      </div>
    </div>
  </div>

  <script src="/ingredient-picker.js" defer></script>
  <script src="/recept.js" defer></script>
</body>
</html>
